name: Release

# Push a tag matching Cargo.toml's version (git tag v0.1.0 && git push origin v0.1.0) to
# build gash for x64 and arm64, publish a GitHub release with the zips, and, once the
# WINGET_TOKEN secret is set, open the winget-pkgs PR for the new version.
# See packaging/winget/README.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME doesn't match the version in Cargo.toml ($version)"
          }

      - run: rustup target add ${{ matrix.target }}

      # .cargo/config.toml links the C runtime statically, so the exe needs only system DLLs.
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/gash.exe"
          $imports = Select-String -Path $exe -Pattern 'VCRUNTIME140' -SimpleMatch -Quiet
          if ($imports) { throw "$exe still imports VCRUNTIME140.dll" }
          $name = "gash-$($env:GITHUB_REF_NAME.TrimStart('v'))-${{ matrix.arch }}"
          New-Item -ItemType Directory "dist/$name" | Out-Null
          Copy-Item $exe, LICENSE, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: gash-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "gash $GITHUB_REF_NAME" --generate-notes

  winget:
    name: Submit to winget
    needs: release
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      # The action can only update a package that's already in winget-pkgs, so the first
      # version is submitted by hand; add the secret after that PR is merged.
      - name: Skip until WINGET_TOKEN is set
        if: env.WINGET_TOKEN == ''
        run: echo "::notice::WINGET_TOKEN isn't set, so no winget-pkgs PR was opened (see packaging/winget/README.md)."

      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        if: env.WINGET_TOKEN != ''
        with:
          identifier: hex2f.gash
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
